<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitter 视频下载器 - 免费在线下载 X/Twitter 视频</title>
  <meta name="description" content="免费在线下载 Twitter/X 视频,支持多种清晰度,无需安装任何软件。" />
  <style>
    :root {
      --bg: #0f1419;
      --bg-card: #1a2129;
      --bg-input: #253341;
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --text: #e7e9ea;
      --text-muted: #8b98a5;
      --border: #2f3b47;
      --success: #00ba7c;
      --error: #f4212e;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px;
      flex: 1;
    }

    header {
      text-align: center;
      padding: 64px 0 40px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo svg { width: 44px; height: 44px; fill: var(--accent); }

    h1 {
      font-size: clamp(1.6rem, 4.5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    h1 .highlight { color: var(--accent); }

    .subtitle {
      color: var(--text-muted);
      margin-top: 12px;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .search-box {
      display: flex;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      transition: border-color 0.2s;
    }

    .search-box:focus-within { border-color: var(--accent); }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      padding: 12px 14px;
      min-width: 0;
    }

    .search-box input::placeholder { color: var(--text-muted); }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .hint {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 14px;
    }

    .status {
      margin: 24px auto 0;
      text-align: center;
      display: none;
    }

    .status.show { display: block; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: rgba(244, 33, 46, 0.1);
      border: 1px solid rgba(244, 33, 46, 0.4);
      color: var(--error);
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 24px;
      display: none;
      line-height: 1.5;
    }

    .error-msg.show { display: block; }

    .result {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 28px;
      overflow: hidden;
      display: none;
      animation: fadeUp 0.35s ease;
    }

    .result.show { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-thumb {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .result-body { padding: 20px 22px; }

    .result-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .result-meta {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 18px;
    }

    .format-list { display: flex; flex-direction: column; gap: 10px; }

    .format-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-input);
      border-radius: 12px;
      padding: 12px 16px;
    }

    .format-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .badge {
      background: rgba(29, 155, 240, 0.15);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 8px;
      padding: 4px 10px;
    }

    .format-size { color: var(--text-muted); font-size: 0.85rem; }

    .btn-download {
      background: var(--success);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 20px;
      font-weight: 700;
      font-size: 0.92rem;
      transition: filter 0.2s;
      white-space: nowrap;
    }

    .btn-download:hover { filter: brightness(1.1); }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 56px 0;
    }

    .feature {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      text-align: center;
    }

    .feature .icon { font-size: 1.8rem; margin-bottom: 10px; }
    .feature h3 { font-size: 1rem; margin-bottom: 6px; }
    .feature p { color: var(--text-muted); font-size: 0.87rem; line-height: 1.55; }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 28px 20px;
      border-top: 1px solid var(--border);
      margin-top: 24px;
      line-height: 1.7;
    }

    @media (max-width: 560px) {
      .search-box { flex-direction: column; }
      .btn { width: 100%; padding: 14px; }
      .format-item { flex-direction: column; align-items: stretch; text-align: center; }
      .format-info { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        <h1>Twitter <span class="highlight">视频下载器</span></h1>
      </div>
      <p class="subtitle">粘贴推文链接,免费下载 Twitter / X 平台视频<br/>支持多种清晰度,无需安装任何软件</p>
    </header>

    <main>
      <form class="search-box" id="parse-form">
        <input
          type="url"
          id="url-input"
          placeholder="https://x.com/用户名/status/..."
          autocomplete="off"
          required
        />
        <button type="submit" class="btn" id="parse-btn">解析视频</button>
      </form>
      <p class="hint">示例:https://x.com/NASA/status/1234567890123456789</p>

      <div class="status" id="status">
        <div class="spinner"></div>
        <p style="color: var(--text-muted)">正在解析视频,请稍候…</p>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <div class="result" id="result">
        <img class="result-thumb" id="result-thumb" alt="视频封面" />
        <div class="result-body">
          <div class="result-title" id="result-title"></div>
          <div class="result-meta" id="result-meta"></div>
          <div class="format-list" id="format-list"></div>
        </div>
      </div>

      <section class="features">
        <div class="feature">
          <div class="icon">⚡</div>
          <h3>快速解析</h3>
          <p>粘贴链接即可秒级解析出视频直链</p>
        </div>
        <div class="feature">
          <div class="icon">🎬</div>
          <h3>多种清晰度</h3>
          <p>提供原始分辨率在内的多档画质选择</p>
        </div>
        <div class="feature">
          <div class="icon">🆓</div>
          <h3>完全免费</h3>
          <p>无需注册登录,不限次数免费使用</p>
        </div>
      </section>
    </main>
  </div>

  <footer>
    本工具仅供个人学习与研究使用,请尊重原作者版权。<br/>
    Twitter Video Download &copy; 2026
  </footer>

  <script>
    const form = document.getElementById('parse-form');
    const input = document.getElementById('url-input');
    const btn = document.getElementById('parse-btn');
    const status = document.getElementById('status');
    const errorMsg = document.getElementById('error-msg');
    const result = document.getElementById('result');
    const thumb = document.getElementById('result-thumb');
    const title = document.getElementById('result-title');
    const meta = document.getElementById('result-meta');
    const formatList = document.getElementById('format-list');

    function formatSize(bytes) {
      if (!bytes) return '大小未知';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
      return bytes.toFixed(1) + ' ' + units[i];
    }

    function formatDuration(seconds) {
      if (!seconds) return '';
      const m = Math.floor(seconds / 60);
      const s = Math.round(seconds % 60);
      return `时长 ${m}:${String(s).padStart(2, '0')}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      result.classList.remove('show');
      status.classList.add('show');
      btn.disabled = true;

      try {
        const resp = await fetch('/api/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input.value.trim() }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.detail || '解析失败,请检查链接后重试');
        }

        if (data.thumbnail) {
          thumb.src = data.thumbnail;
          thumb.style.display = 'block';
        } else {
          thumb.style.display = 'none';
        }
        title.textContent = data.title;
        meta.textContent = ['@' + data.uploader, formatDuration(data.duration)]
          .filter(Boolean).join(' · ');

        formatList.innerHTML = '';
        data.formats.forEach((f) => {
          const item = document.createElement('div');
          item.className = 'format-item';

          const info = document.createElement('div');
          info.className = 'format-info';
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = f.resolution + ' · ' + f.ext.toUpperCase();
          const size = document.createElement('span');
          size.className = 'format-size';
          size.textContent = formatSize(f.filesize);
          info.append(badge, size);

          const link = document.createElement('a');
          link.className = 'btn-download';
          const filename = (data.title || 'twitter-video').slice(0, 50) + '_' + f.resolution + '.mp4';
          link.href = '/api/download?' + new URLSearchParams({ url: f.url, filename });
          link.textContent = '下载';
          link.rel = 'noopener';

          item.append(info, link);
          formatList.appendChild(item);
        });

        result.classList.add('show');
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add('show');
      } finally {
        status.classList.remove('show');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
